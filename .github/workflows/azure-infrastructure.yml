name: Azure Infrastructure

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/azure-infrastructure.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bicep syntax
        run: az bicep build --file infra/main.bicep

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.AZURE_DEPLOY_ENABLED == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Provision the Precision architecture
        run: |
          az deployment sub create \
            --name "precision-platform-${GITHUB_RUN_ID}" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters \
              location="${{ vars.AZURE_LOCATION }}" \
              resourceGroupName="${{ vars.AZURE_RESOURCE_GROUP }}" \
              containerRegistryName="${{ vars.AZURE_CONTAINER_REGISTRY }}"
